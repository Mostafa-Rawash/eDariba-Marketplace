<!-- Request status/response update, to the requester. Sent by services/notifications.py:notify_status_change.
     Inline styles only (email clients drop <style>). Link only; the reply is shown in the app after login. -->
{%- set status_label = {
	"Responded": "ردّ على طلبك",
	"Accepted": "قبل طلبك",
	"Declined": "اعتذر عن طلبك",
	"Closed": "أغلق الطلب",
}.get(status, "حدّث طلبك") -%}
<table role="presentation" dir="rtl" width="100%" border="0" cellpadding="0" cellspacing="0"
	style="max-width:560px; margin:0 auto; direction:rtl; text-align:right; font-family:'Tajawal','IBM Plex Sans Arabic',system-ui,sans-serif; color:#11110D;">
	<tr>
		<td bgcolor="#203524" style="background:#203524; border-radius:24px; padding:32px;">
			<p style="margin:0 0 10px; font-size:14px; font-weight:700; line-height:1.5; color:#D1F470;">سوق eDariba</p>
			<h1 style="margin:0 0 12px; font-size:26px; font-weight:700; line-height:1.3; color:#FFFFFF;">
				{{ provider_name or "المحاسب" }} {{ status_label }}
			</h1>
			<p style="margin:0 0 24px; font-size:16px; line-height:1.75; color:rgba(255,255,255,0.75);">
				افتح الطلب لمتابعة التفاصيل.
			</p>
			<a href="{{ url }}" style="display:inline-block; background:#D1F470; color:#11110D; font-size:16px; font-weight:700; text-decoration:none; padding:12px 28px; border-radius:999px;">عرض الطلب</a>
		</td>
	</tr>
</table>
